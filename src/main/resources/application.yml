spring:
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/nexosalud}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:postgres}
  application:
    name: schedule-service
  sql:
    init:
      mode: never
      schema-locations: classpath:db/migration/schema.sql
logging:
  level:
    org.springframework.data.r2dbc: Debug

server:
  port: ${SERVER_PORT:8083}

---
spring:
  config:
    activate:
      on-profile: test
  r2dbc:
    url: r2dbc:h2:mem:///test?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    name: sa
    password:
  application:
    name: schedule-service

server:
  port: 8083

---
spring:
  config:
    activate:
      on-profile: prod
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/nexosalud}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:postgres}
  application:
    name: schedule-service
  logging:
    level:
      org.springframework.data.r2dbc: Debug

server:
  port: ${SERVER_PORT:8083}
